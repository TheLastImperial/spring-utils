<html>
  <body>
    <div
      th:fragment="pagination(page, defaultSize, baseUrl, txtPage, txtOf, txtPrevius, txtNext)"
      class="d-flex flex-wrap justify-content-between align-items-center mt-3 gap-2"
      th:with="
        size=${param.size == null ? defaultSize : param.size},
        q=${param.q == null ? null : param.q},
        txtPage=${txtPage ?: 'Page'},
        txtOf=${txtOf ?: 'of'},
        txtPrevius=${txtPrevius ?: 'Previus'},
        txtNext=${txtNext ?: 'Next'}
      ">
      <span id="paginationInfo"
        class="text-muted small"
        th:inline="text">
        [[
          ${txtPage} + ' ' +  ${page.getNumber + 1} + ' ' +
          ${txtOf} + ' ' + ${page.getTotalPages}
        ]]
      </span>
      <nav>
        <ul class="pagination pagination-sm mb-0" id="pagination">
          <li
            class="page-item"
            th:classappend="${page.hasPrevious} ? '' : 'disabled'">
            <a class="page-link" href="#" th:if="${not page.hasPrevious}"
              th:inline="text">
              [[ ${ txtPrevius } ]]
            </a>
            <a class="page-link"
              th:href="@{{baseUrl}?page={page}&size={size}__(${q == null} ? '' : '&q=' + ${q})__(page=${page.getNumber},size=${size},baseUrl=${baseUrl})}"
              th:if="${page.hasPrevious}"
              th:inline="text">
              [[ ${ txtPrevius } ]]
            </a>
          </li>
          <li class="page-item">
            <a class="page-link" th:text="${page.getNumber + 1}">
            </a>
          </li>
          <li class="page-item"
            th:classappend="${page.hasNext} ? '' : 'disabled'">
            <a class="page-link" href="#"
              th:if="${not page.hasNext}"
              th:inline="text">
              [[ ${ txtNext } ]]
            </a>
            <a class="page-link"
              th:href="@{{baseUrl}?page={page}&size={size}__(${q == null} ? '' : '&q=' + ${q})__(page=${page.getNumber + 2},size=${size},baseUrl=${baseUrl})}"
              th:if="${page.hasNext}"
              th:inline="text">
              [[ ${ txtNext } ]]
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </body>
</html>
